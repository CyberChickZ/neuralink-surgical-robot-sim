# Baseline: literature pulsation amplitudes (Paulk 2022 cardiac, Faria 2014 respiratory), 4 mN puncture threshold.
name: default
duration: 150
initial:
  joints: {lift_y: 0.235}   # needle tip ~5 cm above the brain (head hover, option A)
needle:
  insert_speed: 0.1     # m/s
  retract_speed: 0.3    # m/s
brain:
  amp_card_pp: 0.0001
  f_card: 1.0
  amp_resp_pp: 0.0005
  f_resp: 0.3333333
  puncture_force_n: 0.004
pass:
  max_vessel_hits: 0
  min_punctured: 6
