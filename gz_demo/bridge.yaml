# ros_gz_bridge config: ROS2 Jazzy <-> Gazebo Harmonic
- {ros_topic_name: /clock, gz_topic_name: /clock, ros_type_name: rosgraph_msgs/msg/Clock, gz_type_name: gz.msgs.Clock, direction: GZ_TO_ROS}
- {ros_topic_name: /joint_states, gz_topic_name: /joint_states, ros_type_name: sensor_msgs/msg/JointState, gz_type_name: gz.msgs.Model, direction: GZ_TO_ROS}
- {ros_topic_name: /cmd/lift_y, gz_topic_name: /cmd/lift_y, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /cmd/arm_roll_z, gz_topic_name: /cmd/arm_roll_z, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /cmd/wrist_pitch_x, gz_topic_name: /cmd/wrist_pitch_x, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /cmd/head_rot, gz_topic_name: /cmd/head_rot, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /cmd/stage_x, gz_topic_name: /cmd/stage_x, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /cmd/stage_z, gz_topic_name: /cmd/stage_z, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /cmd/twinz_insert, gz_topic_name: /cmd/twinz_insert, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /cam/c0/image, gz_topic_name: /cam/c0/image, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /cam/c1/image, gz_topic_name: /cam/c1/image, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /cam/c2/image, gz_topic_name: /cam/c2/image, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /cam/c3/image, gz_topic_name: /cam/c3/image, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /cam/overview/image, gz_topic_name: /cam/overview/image, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
